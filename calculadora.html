<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiSueldo</title>
  <link rel="stylesheet" href="calculadora.css">
</head>
<body>
  <div class ="contenedor">
    <div class="titulo">
      <h1>Calcula tu sueldo</h1>
    </div>
    <div class="saludoUsuario">
      <label class="nombreUsuario oculto">Hola ! <span id="nombreUsuarioTexto"></span></label>
    </div>
    <div class="ingresoSalario">
      <label class="labelSalario" for="salarioIngresado">Ingresa tu sueldo:</label>
      <input class="cajaIngresanSalario" type="text" id="salarioIngresado" name="salarioIngresado" placeholder="000000000.00">
      <button class="botonLimpiar" id="limpiar" disabled>Limpiar</button>
    </div>
    <div class="botonContenedorCalcular">
      <button class="btnCalcular" id="calcular">Calcular</button>
    </div>
    <div class="contenedorDescuentos">
      <label class="descuentos">Descuentos:</label>
    </div>
    <div class="muestraDescuentos">
      <label id="isss" class="descuentoIsss" >ISSS: $</label>
      <label id="afp" class="descuentoAfp" >AFP: $</label>
      <label id="isr" class="descuentoIsr" >ISR: $</label>
    </div>
    <div class="muestraSalarioNeto">
      <label id="salarioNeto" class="salarioNeto" >Sueldo Neto: $</label>
    </div>
  </div>
  <div class="modal-overlay" id="nombreModal" aria-hidden="true">
    <div class="modal">
      <p class="modal-texto">¿ Como te podemos llamar, cual es tu nombre ?</p>
      <input type="text" id="nombreInput" class="modal-input" placeholder="Escribe tu nombre">
      <div class="modal-botones">
        <button class="btnModal secundario" id="nombreNoInteresa">No me interesa</button>
        <button class="btnModal primario" id="nombreAceptar">Aceptar</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="calculadora.js"></script>
</body>
</html>
